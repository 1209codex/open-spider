<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff80" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00e673" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Cyber Background Hex Ring -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18" stroke="#1a2333" stroke-width="2" fill="#0c1017" />
  <polygon points="32,8 52,20 52,44 32,56 12,44 12,20" stroke="rgba(0, 255, 128, 0.2)" stroke-width="1" />

  <!-- Spider Body & Core -->
  <circle cx="32" cy="32" r="7" fill="url(#spiderGlow)" filter="url(#neon)" />
  <circle cx="32" cy="22" r="4.5" fill="#00ff80" filter="url(#neon)" />

  <!-- Glowing Eyes -->
  <circle cx="30" cy="21" r="1" fill="#0a0c10" />
  <circle cx="34" cy="21" r="1" fill="#0a0c10" />

  <!-- Cyber Legs - Left -->
  <path d="M28 26 L16 18 L10 22" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M26 30 L12 28 L6 34" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M26 34 L12 38 L8 46" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M28 37 L18 46 L14 54" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Cyber Legs - Right -->
  <path d="M36 26 L48 18 L54 22" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 30 L52 28 L58 34" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M38 34 L52 38 L56 46" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M36 37 L46 46 L50 54" stroke="url(#spiderGlow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Circuit nodes -->
  <circle cx="10" cy="22" r="1.5" fill="#38bdf8" />
  <circle cx="6" cy="34" r="1.5" fill="#38bdf8" />
  <circle cx="8" cy="46" r="1.5" fill="#38bdf8" />
  <circle cx="14" cy="54" r="1.5" fill="#38bdf8" />
  <circle cx="54" cy="22" r="1.5" fill="#38bdf8" />
  <circle cx="58" cy="34" r="1.5" fill="#38bdf8" />
  <circle cx="56" cy="46" r="1.5" fill="#38bdf8" />
  <circle cx="50" cy="54" r="1.5" fill="#38bdf8" />
</svg>
